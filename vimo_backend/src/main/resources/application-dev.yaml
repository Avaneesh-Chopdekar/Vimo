spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vimo_db
    username: vimo_user
    password: vimo_password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    format-sql: true
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /docs

custom:
  video:
    path: ${VIDEO_PATH:videos/}
    hls_path: ${VIDEO_HLS_PATH:videos_hls/}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:vimo_issuer}
    access_ttl_seconds: ${JWT_ACCESS_TTL_SECONDS:900} # 15 minutes
    refresh_ttl_seconds: ${JWT_REFRESH_TTL_SECONDS:604800} # 7 days
    refresh_token_cookie_name: ${JWT_REFRESH_COOKIE_NAME:refresh_token}
    cookie_secure: ${JWT_COOKIE_SECURE:false}
    cookie_http_only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie_same_site: ${JWT_COOKIE_SAME_SITE:lax}
    cookie_domain: ${JWT_COOKIE_DOMAIN:localhost}

